[project]
name = "knowledge-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.136", "starlette>=0.46,<1.0", "anyio>=4.0,<4.12", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "itsdangerous>=2.2", "pwdlib[argon2]>=0.2", "alembic>=1.13"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["knowledge_ai"]
[tool.pytest.ini_options]
pythonpath = ["."]
