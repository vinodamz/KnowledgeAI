name: Publish demo Docker images
on:
  push:
    branches: [codex/demo-stage-1]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vinodamz/knowledge-ai-${{ matrix.service }}:demo
            ghcr.io/vinodamz/knowledge-ai-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published architectures
        env:
          IMAGE: ghcr.io/vinodamz/knowledge-ai-${{ matrix.service }}:${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" | python3 -c 'import json,sys; data=json.load(sys.stdin); platforms={(item.get("platform",{}).get("os"),item.get("platform",{}).get("architecture")) for item in data["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= platforms, platforms'
          echo "Published and verified: \`$IMAGE\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
